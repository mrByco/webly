<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  What a page's generic font families resolve to inside the sandbox, which is what the agent's screenshots show.

  Debian's own rules want DejaVu for sans-serif, and the slim image with no recommended packages does not have it,
  so fontconfig fell through to the first face it had: Liberation Mono. Every page whose stylesheet ends in
  `sans-serif` — the template's own fallback when its web font is unavailable, and any page an agent sets in
  `system-ui` — was photographed in a typewriter face no visitor ever sees, and the agent was asked to judge its
  work from that picture. Found by running the image and looking at what it took.

  Liberation's three are metric-compatible with Arial, Times New Roman and Courier New, which is as close as a
  machine with no proprietary fonts can come to what most visitors' browsers draw.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
