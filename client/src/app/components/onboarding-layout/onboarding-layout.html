<div class="flex min-h-dvh flex-col bg-base-200">
  <header class="flex items-center gap-4 px-6 py-5">
    <span class="flex items-center gap-2.5">
      <span class="grid size-9 shrink-0 place-items-center rounded-box bg-primary text-primary-content">
        <app-icon class="size-5" name="layout" />
      </span>
      <span class="text-lg font-bold tracking-tight">Webly</span>
    </span>

    @if (exitLabel(); as label) {
      <button class="btn btn-ghost btn-sm ml-auto" type="button" (click)="exit.emit()">
        {{ label }}
      </button>
    }
  </header>

  <main class="flex flex-1 items-start justify-center px-6 pb-10 sm:items-center sm:pb-16">
    <div class="w-full max-w-lg">
      <div class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight">{{ heading() }}</h1>
        @if (subheading()) {
          <p class="mt-1.5 text-base-content/60">{{ subheading() }}</p>
        }
      </div>

      <ng-content />
    </div>
  </main>

  <footer class="px-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] text-center text-sm text-base-content/55">
    {{ me().email }} ·
    <button class="link" type="button" (click)="signOut()">Sign out</button>
  </footer>
</div>
