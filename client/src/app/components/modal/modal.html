<!--
  A sheet from the bottom on a phone, where the thumb already is, and centred from `sm` up.

  The action row belongs to whatever is inside: a dialog's buttons are part of the thing being
  decided, and projecting them through a second slot would separate them from the state they act on.

  A native `<dialog>`, always in the page and opened with `showModal()` — see the class for why. The backdrop
  button is out of the tab order because Escape is the keyboard's way out; it stays a button so that a pointer
  and a screen reader each still have one.
-->
<dialog #dialog class="modal modal-bottom sm:modal-middle" (cancel)="dismiss($event)" (close)="closed()">
  <div class="modal-box">
    @if (title()) {
      <h2 class="text-xl font-bold">{{ title() }}</h2>
    }

    <ng-content />
  </div>

  <button class="modal-backdrop" type="button" aria-label="Close" tabindex="-1" (click)="close.emit()"></button>
</dialog>
