<app-auth-layout
  heading="Forgotten password"
  subheading="We will email you a link to set a new one.">
  @if (sent()) {
    <div class="flex flex-col gap-5">
      <div role="alert" class="alert alert-success alert-soft text-sm">
        If there is an account with that address, the reset link is on its way to it.
      </div>
      <p class="text-sm text-base-content/60">
        Check your spam folder too. The link is valid for one hour.
      </p>
      <a class="btn btn-outline w-full" [routerLink]="routes.login.build()">
        Back to sign in
      </a>
    </div>
  } @else {
    <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="floating-label">
        <span>Email address</span>
        <input
          class="input input-bordered w-full"
          type="email"
          placeholder="nev@example.com"
          formControlName="email"
          autocomplete="email"
          required />
      </label>

      <button class="btn btn-primary w-full" type="submit" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="loading loading-spinner loading-sm"></span>
        }
        Send the link
      </button>

      <p class="text-sm text-center text-base-content/60">
        Eszedbe jutott?
        <a class="link link-primary font-medium" [routerLink]="routes.login.build()">Jelentkezz be</a>
      </p>
    </form>
  }
</app-auth-layout>
