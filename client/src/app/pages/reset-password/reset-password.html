<app-auth-layout heading="New password" subheading="Set it here and you will be signed in.">
  @if (!token) {
    <div class="flex flex-col gap-5">
      <div role="alert" class="alert alert-error alert-soft text-sm">
        That link is incomplete. Open the whole link from the email.
      </div>
      <a class="btn btn-outline w-full" [routerLink]="routes.forgotPassword.build()">Ask for a new link</a>
    </div>
  } @else {
    <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
      @if (error(); as message) {
        <div role="alert" class="alert alert-error alert-soft text-sm">
          {{ message }}
          <a class="link font-medium" [routerLink]="routes.forgotPassword.build()">Send me a new one</a>
        </div>
      }

      <div>
        <label class="floating-label">
          <span>New password</span>
          <input
            class="input input-bordered w-full"
            type="password"
            placeholder="New password"
            formControlName="newPassword"
            autocomplete="new-password"
            required />
        </label>
        <p class="mt-1.5 text-xs text-base-content/50">At least 8 characters.</p>
      </div>

      <button class="btn btn-primary w-full" type="submit" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="loading loading-spinner loading-sm"></span>
        }
        Save the password
      </button>

      <p class="text-xs text-center text-base-content/50">
        Saving signs out every other device.
      </p>
    </form>
  }
</app-auth-layout>
