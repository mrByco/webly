<app-onboarding-layout
  heading="Confirm your email address"
  [subheading]="'We sent a six-digit code to ' + (me().email ?? '')">
  @if (state() === 'failed') {
    <div class="card border border-base-300 bg-base-100">
      <div class="card-body gap-5">
        <div role="alert" class="alert alert-error alert-soft text-sm">
          {{ error() }}
        </div>

        <button class="btn btn-primary w-full" type="button" (click)="goToLogin()">
          Sign in
        </button>
      </div>
    </div>
  } @else {
    <div class="card border border-base-300 bg-base-100">
      <div class="card-body gap-5">
        <label class="form-control">
          <span class="label-text mb-2 font-medium">Confirmation code</span>
          <input
            class="input input-bordered input-lg w-full text-center font-mono text-2xl tracking-[0.5em]"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="------"
            autofocus
            [ngModel]="code()"
            (ngModelChange)="onCodeInput($event)"
            (keyup.enter)="submitCode()" />
        </label>

        @if (error()) {
          <div role="alert" class="alert alert-error alert-soft text-sm">{{ error() }}</div>
        }

        <button
          class="btn btn-primary w-full"
          type="button"
          [disabled]="!canSubmit()"
          (click)="submitCode()">
          @if (state() === 'checking') {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Confirm
        </button>

        <p class="text-center text-sm text-base-content/50">
          @if (resent()) {
            A new code is on its way. Check your inbox.
          } @else {
            Nothing arrived?
            <button class="link link-primary" type="button" (click)="resend()">Send a new code</button>
          }
        </p>
      </div>
    </div>

    <p class="mt-4 text-center text-sm text-base-content/50">
      You can also confirm from the button in the email — this page moves on by itself when you do.
    </p>
  }
</app-onboarding-layout>
