<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webly</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build, version and publish your website by describing it. No code, no templates to fight.">

  <!-- The app's own indigo in light, its dark base in dark, so the browser chrome matches the page. -->
  <meta name="theme-color" content="#4b4ddb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#232433" media="(prefers-color-scheme: dark)">

  <!--
    Source Sans 3. Preconnected because the font is on the critical path for the first paint, and the
    CSS falls back to the system stack until it lands.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
