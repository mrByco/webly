<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webly</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build, version and publish your website by describing it. No code, no templates to fight.">

  <!--
    The app's own indigo in light, its dark base in dark, so the browser chrome matches the page. As hex,
    because a meta tag cannot read a CSS variable — these are `--color-primary` and the dark `--color-base-100`
    from styles.css, converted. They were two other indigos for a while, close enough that nobody saw it and
    far enough that the phone's address bar was a colour this app does not use.
  -->
  <meta name="theme-color" content="#3b5bd4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202329" media="(prefers-color-scheme: dark)">

  <!--
    The app's own typeface, self-hosted (see the @font-face rules in styles.css for why it is no longer
    Google's), and preloaded because it is on the critical path for the first paint: without the hint the
    browser learns it needs the file only once the stylesheet is parsed. The Latin file only — the Extended
    one is for accented names, and most visitors never need it.
  -->
  <link rel="preload" href="/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
